name: Keep Supabase Alive

on:
  schedule:
    - cron: '0 12 */3 * *'  # every 3 days at noon UTC
  workflow_dispatch:          # allow manual trigger from GitHub UI

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://ixdsojtdqwcrlgstsbcg.supabase.co/rest/v1/signups?select=id&limit=1" \
            -H "apikey: sb_publishable_GtZd5Nu8XrcBIfgYp35s3w_6aUC3LK2" \
            -H "Authorization: Bearer sb_publishable_GtZd5Nu8XrcBIfgYp35s3w_6aUC3LK2")
          echo "Supabase responded with HTTP $STATUS"
          [ "$STATUS" = "200" ] && echo "OK" || echo "WARNING: unexpected status"
